services:
  app:
    build: .
    image: chronoverse:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CHRONOVERSE_DB: /data/chronoverse.sqlite3
    volumes:
      - ledger:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  mcp:
    image: chronoverse:local
    command: ["python", "-m", "chronoverse.mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      CHRONOVERSE_DB: /data/chronoverse.sqlite3
    volumes:
      - ledger:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ledger:
